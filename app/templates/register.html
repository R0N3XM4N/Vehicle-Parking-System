{% extends "base.html" %}

{% block title %}Register | Vehicle Parking System{% endblock %}

{% block content %}
  <section class="auth-card">
    <p class="eyebrow">Get started</p>
    <h1>Create an account</h1>
    <p class="card-intro">Reserve parking slots and manage every visit online.</p>
    <form class="stacked-form" method="POST">
      <div class="form-group">
        <label for="name">Full name</label>
        <input id="name" type="text" name="name" autocomplete="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" type="email" name="email" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" minlength="8" autocomplete="new-password" required>
        <small>Use at least 8 characters.</small>
      </div>
      <button class="button form-submit" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already registered? <a href="{{ url_for('main.login') }}">Log in</a></p>
  </section>
{% endblock %}
