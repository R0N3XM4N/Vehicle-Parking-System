{% extends "base.html" %}

{% block title %}Log in | Vehicle Parking System{% endblock %}

{% block content %}
  <section class="auth-card">
    <p class="eyebrow">Welcome back</p>
    <h1>Log in</h1>
    <p class="card-intro">Access your parking reservations and available slots.</p>
    <form class="stacked-form" method="POST">
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" type="email" name="email" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="button form-submit" type="submit">Log in</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('main.register') }}">Create an account</a></p>
  </section>
{% endblock %}
