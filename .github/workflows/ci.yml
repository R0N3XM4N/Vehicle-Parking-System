
name: Vehicle Parking System CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f README.md
          test -f docs/TEST_PLAN.md
          test -f docs/Vehicle-Parking-System_SRS.pdf
          test -f docs/Vehicle_Parking_System_SAD.pdf
          echo "Required project documents found."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run acceptance and regression tests
        run: python -m coverage run --source=app -m xmlrunner discover -s tests -o test-results

      - name: Report coverage
        if: always()
        run: |
          python -m coverage report --fail-under=80
          python -m coverage xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-python-${{ matrix.python-version }}
          path: |
            test-results/
            coverage.xml
          if-no-files-found: error

  browser-stories:
    # Match the OS supported by the pinned Chromium/Playwright release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Verify user story browser flows at three sizes
        run: python -m scripts.browser_smoke
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-story-evidence
          path: test-results/browser/
          if-no-files-found: error

  deploy:
    name: Build and smoke-test deployment image
    needs: [verify, browser-stories]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: vehicle-parking-system:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag "$IMAGE_NAME" .

      - name: Start deployment container
        run: |
          docker run --detach --rm --name vehicle-parking-system \
            --publish 5000:5000 \
            "$IMAGE_NAME"

      - name: Verify deployment responds
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:5000/login; then
              exit 0
            fi
            sleep 1
          done
          echo "The deployment container did not become ready."
          docker logs vehicle-parking-system
          exit 1

      - name: Stop deployment container
        if: always()
        run: docker stop vehicle-parking-system || true
